name: Deploy Backend to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Auto Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            echo "🚀 Auto-deploying Backend..."
            TARGET_DIR="$HOME/video-editing-backend"
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📁 Cloning fresh repository..."
              rm -rf "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"
            echo "🔄 Fetching latest code..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            git clean -fd
            echo "🐳 Building and launching Docker containers..."
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose up --build -d
            elif command -v docker-compose &> /dev/null; then
              docker-compose up --build -d
            else
              echo "Executing npm build fallback..."
              npm install
              npm run build
              pm2 restart all || node dist/src/main.js &
            fi
            echo "✅ Backend successfully deployed to VPS!"
